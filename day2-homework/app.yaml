command:
  - "python"
  - "app.py"

env:
  # Dedicated secret scope for this assignment, kept separate from the class
  # reference app's "database" scope to avoid any confusion between the two.
  # Every file in this app resolves the Lakebase URL through lakebase.py's
  # LAKEBASE_SECRET_SCOPE env var below -- never a hardcoded literal -- so
  # this is the single place that name is defined.
  - name: LAKEBASE_SECRET_SCOPE
    value: "database_weather"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  - name: MASSIVE_API_BASE_URL
    value: "https://api.massive.com"
  - name: MASSIVE_SECRET_SCOPE
    value: "massive"
  - name: MASSIVE_SECRET_KEY
    value: "api-key"
  - name: WEATHER_API_BASE_URL
    value: "https://api.weather.gov"
  # NWS requires a descriptive User-Agent identifying the app + a contact --
  # generic User-Agents get throttled/blocked. Update the contact email below.
  - name: WEATHER_USER_AGENT
    value: "(databricks-lakebase-day2-homework, lakshmichaudhari@gmail.com)"
